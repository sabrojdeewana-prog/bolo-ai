/* =========================================
   FIRESTORE CHAT HISTORY
   Uses Firebase Auth token + Firestore REST API
========================================= */

function firestoreUserPath(){

  if(!currentUser){
    return null;
  }

  return (
    FIRESTORE_BASE_URL +
    "/users/" +
    encodeURIComponent(
      currentUser.uid
    ) +
    "/chats"
  );

}


async function getFirebaseToken(){

  if(!currentUser){
    throw new Error(
      "User is not logged in."
    );
  }

  return await currentUser.getIdToken(
    true
  );

}


function firestoreString(value){

  return {
    stringValue:
      String(value || "")
  };

}


function firestoreBoolean(value){

  return {
    booleanValue:
      !!value
  };

}


function firestoreTimestamp(){

  return {
    timestampValue:
      new Date().toISOString()
  };

}


/*
  Uploaded photos are resized before being
  stored in Firestore so a large 10 MB image
  is never written directly to a document.
*/

function compressPhotoForHistory(
  dataUrl
){

  return new Promise(
    function(resolve){

      if(
        !dataUrl ||
        typeof dataUrl !== "string" ||
        !dataUrl.startsWith("data:image")
      ){

        resolve(null);
        return;

      }

      const image =
        new Image();

      image.onload =
        function(){

          const maxSize =
            700;

          let width =
            image.width;

          let height =
            image.height;


          if(
            width > maxSize ||
            height > maxSize
          ){

            if(width > height){

              height =
                Math.round(
                  height *
                  maxSize /
                  width
                );

              width =
                maxSize;

            }else{

              width =
                Math.round(
                  width *
                  maxSize /
                  height
                );

              height =
                maxSize;

            }

          }


          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );

          ctx.drawImage(
            image,
            0,
            0,
            width,
            height
          );


          let compressed =
            canvas.toDataURL(
              "image/jpeg",
              0.55
            );


          /*
            Keep the stored photo safely below
            Firestore's document-size limit.
          */

          if(
            compressed.length >
            700000
          ){

            compressed =
              canvas.toDataURL(
                "image/jpeg",
                0.35
              );

          }


          if(
            compressed.length >
            850000
          ){

            compressed =
              null;

          }


          resolve(
            compressed
          );

        };


      image.onerror =
        function(){

          resolve(null);

        };


      image.src =
        dataUrl;

    }
  );

}


async function saveChatMessageToHistory(
  text,
  role,
  photo
){

  if(
    !currentUser ||
    !firebaseReady
  ){

    return;

  }


  try{

    const token =
      await getFirebaseToken();


    let safePhoto =
      null;


    /*
      Only uploaded user photos are stored.
      Generated AI images are not copied into
      Firestore because they can be very large.
    */

    if(
      role === "user" &&
      photo
    ){

      safePhoto =
        await compressPhotoForHistory(
          photo
        );

    }


    const documentId =
      "msg_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,10);


    const fields = {

      role:
        firestoreString(
          role
        ),

      text:
        firestoreString(
          text
        ),

      hasPhoto:
        firestoreBoolean(
          !!photo
        ),

      createdAt:
        firestoreTimestamp()

    };


    if(safePhoto){

      fields.photo =
        firestoreString(
          safePhoto
        );

    }


    const response =
      await fetch(
        firestoreUserPath() +
        "?documentId=" +
        encodeURIComponent(
          documentId
        ),
        {

          method:
            "POST",

          headers:{

            "Authorization":
              "Bearer " +
              token,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({
              fields
            })

        }
      );


    if(!response.ok){

      const errorText =
        await response.text();

      console.error(
        "Chat history save failed:",
        errorText
      );

    }

  }catch(error){

    console.error(
      "Chat history save error:",
      error
    );

  }

}


function firestoreValueToString(
  field
){

  if(!field){
    return "";
  }

  if(
    field.stringValue !==
    undefined
  ){

    return field.stringValue;

  }

  if(
    field.booleanValue !==
    undefined
  ){

    return field.booleanValue
      ? "true"
      : "false";

  }

  if(
    field.timestampValue !==
    undefined
  ){

    return field.timestampValue;

  }

  return "";

}


function documentCreatedTime(
  document
){

  const field =
    document.fields &&
    document.fields.createdAt;


  if(
    field &&
    field.timestampValue
  ){

    const time =
      Date.parse(
        field.timestampValue
      );

    if(!Number.isNaN(time)){
      return time;
    }

  }

  return 0;

}


async function loadChatHistory(){

  if(
    !currentUser ||
    !firebaseReady ||
    historyLoading ||
    historyLoaded
  ){

    return;

  }


  historyLoading =
    true;


  try{

    const token =
      await getFirebaseToken();


    let allDocuments =
      [];

    let nextPageToken =
      "";


    do{

      let url =
        firestoreUserPath() +
        "?pageSize=100&orderBy=createdAt";

      if(nextPageToken){

        url +=
          "&pageToken=" +
          encodeURIComponent(
            nextPageToken
          );

      }


      const response =
        await fetch(
          url,
          {

            method:
              "GET",

            headers:{
              "Authorization":
                "Bearer " +
                token
            }

          }
        );


      if(!response.ok){

        const errorText =
          await response.text();

        throw new Error(
          errorText ||
          "Could not load chat history."
        );

      }


      const data =
        await response.json();


      if(
        Array.isArray(
          data.documents
        )
      ){

        allDocuments =
          allDocuments.concat(
            data.documents
          );

      }


      nextPageToken =
        data.nextPageToken ||
        "";

    }while(nextPageToken);


    allDocuments.sort(
      function(a,b){

        return (
          documentCreatedTime(a) -
          documentCreatedTime(b)
        );

      }
    );


    /*
      Do not duplicate messages if history is
      already visible on the screen.
    */

    const messagesContainer =
      $("chatMessages");


    messagesContainer
      .innerHTML =
      "";


    if(
      !allDocuments.length
    ){

      messagesContainer.innerHTML =

        '<div class="empty-chat" id="emptyChat">' +

          '<img src="/icon-192.png" alt="Bolo AI">' +

          '<strong>How can I help you today?</strong>' +

          '<span>Ask a question, upload a photo or use your voice.</span>' +

        '</div>';

    }else{

      allDocuments.forEach(
        function(document){

          const fields =
            document.fields ||
            {};


          const role =
            firestoreValueToString(
              fields.role
            );


          const text =
            firestoreValueToString(
              fields.text
            );


          let photo =
            null;


          if(
            fields.photo &&
            fields.photo.stringValue
          ){

            photo =
              fields.photo.stringValue;

          }


          if(
            role === "user" ||
            role === "assistant"
          ){

            renderMessage(
              text,
              role,
              photo
            );

          }

        }
      );

    }


    historyLoaded =
      true;


  }catch(error){

    console.error(
      "Chat history load error:",
      error
    );


    historyLoaded =
      true;

  }finally{

    historyLoading =
      false;

  }

}


async function clearChatHistory(){

  if(!currentUser){

    showToast(
      "Please login first."
    );

    return;

  }


  const confirmed =
    confirm(
      "Clear all your Bolo AI chat history?\n\nThis cannot be undone."
    );


  if(!confirmed){
    return;
  }


  try{

    showToast(
      "Clearing chat history…"
    );


    const token =
      await getFirebaseToken();


    let documents =
      [];

    let nextPageToken =
      "";


    do{

      let url =
        firestoreUserPath() +
        "?pageSize=100";

      if(nextPageToken){

        url +=
          "&pageToken=" +
          encodeURIComponent(
            nextPageToken
          );

      }


      const response =
        await fetch(
          url,
          {

            headers:{
              "Authorization":
                "Bearer " +
                token
            }

          }
        );


      if(!response.ok){

        throw new Error(
          "Could not read history."
        );

      }


      const data =
        await response.json();


      if(
        Array.isArray(
          data.documents
        )
      ){

        documents =
          documents.concat(
            data.documents
          );

      }


      nextPageToken =
        data.nextPageToken ||
        "";

    }while(nextPageToken);


    for(
      const document
      of documents
    ){

      if(
        !document.name
      ){
        continue;
      }


      await fetch(
        "https://firestore.googleapis.com/v1/" +
        document.name,
        {

          method:
            "DELETE",

          headers:{
            "Authorization":
              "Bearer " +
              token
          }

        }
      );

    }


    const messages =
      $("chatMessages");


    messages.innerHTML =

      '<div class="empty-chat" id="emptyChat">' +

        '<img src="/icon-192.png" alt="Bolo AI">' +

        '<strong>How can I help you today?</strong>' +

        '<span>Ask a question, upload a photo or use your voice.</span>' +

      '</div>';


    historyLoaded =
      true;


    showToast(
      "Chat history cleared."
    );


  }catch(error){

    console.error(
      "Clear history error:",
      error
    );


    showToast(
      "Could not clear chat history."
    );

  }

}

function renderMessage(
  text,
  role,
  photo
){

  const empty =
    $("emptyChat");

  if(empty){
    empty.remove();
  }

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row " +
    role;

  const box =
    document.createElement(
      "div"
    );

  box.className =
    "message " +
    role;

  if(text){

    const textDiv =
      document.createElement(
        "div"
      );

    textDiv.textContent =
      text;

    box.appendChild(
      textDiv
    );

  }

  if(photo){

    const img =
      document.createElement(
        "img"
      );

    img.className =
      "message-photo";

    img.src =
      photo;

    img.alt =
      "Uploaded photo";

    box.appendChild(
      img
    );

  }


  if(
    role === "assistant" &&
    text
  ){

    const tools =
      document.createElement(
        "div"
      );

    tools.className =
      "message-tools";


    const listen =
      document.createElement(
        "button"
      );

    listen.type =
      "button";

    listen.textContent =
      "🔊 Listen";

    listen.onclick =
      function(){

        speakText(
          text
        );

      };


    const stop =
      document.createElement(
        "button"
      );

    stop.type =
      "button";

    stop.textContent =
      "⏹ Stop";

    stop.onclick =
      function(){

        stopSpeaking();

      };


    tools.appendChild(
      listen
    );

    tools.appendChild(
      stop
    );

    box.appendChild(
      tools
    );

  }


  row.appendChild(
    box
  );


  $("chatMessages")
    .appendChild(
      row
    );


  const messages =
    $("chatMessages");

  messages.scrollTop =
    messages.scrollHeight;

}


function addMessage(
  text,
  role,
  photo
){

  renderMessage(
    text,
    role,
    photo
  );

}

async function submitAuth(){

  if(!firebaseReady){

    showToast(
      "Firebase is not available right now."
    );

    return;

  }


  const email =
    $("authEmail")
      .value
      .trim();


  const password =
    $("authPassword")
      .value;


  const name =
    $("authName")
      .value
      .trim();


  if(
    !email ||
    !password
  ){

    showToast(
      "Enter your email and password."
    );

    return;

  }


  try{

    if(
      authMode === "login"
    ){

      await firebase
        .auth()
        .signInWithEmailAndPassword(
          email,
          password
        );


      showToast(
        "Login successful."
      );

    }else{

      if(!name){

        showToast(
          "Enter your name."
        );

        return;

      }


      const result =
        await firebase
          .auth()
          .createUserWithEmailAndPassword(
            email,
            password
          );


      if(
        result.user
      ){

        await result.user
          .updateProfile({
            displayName:
              name
          });

      }


      showToast(
        "Account created successfully."
      );

    }


    closeModal(
      "authModal"
    );

  }catch(error){

    console.error(
      error
    );

    showToast(
      error.message ||
      "Authentication failed."
    );

  }

}

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(text){

  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================
   CHAT
========================================= */

let selectedPhoto =
  null;

let recognition =
  null;


async function sendChat(){

  const input =
    $("chatInput");


  const text =
    input.value.trim();


  if(
    !text &&
    !selectedPhoto
  ){

    showToast(
      "Type a message or upload a photo."
    );

    return;

  }


  const photo =
    selectedPhoto;


  const userMessage =
    text ||
    "Please analyse this photo.";


  addMessage(
    userMessage,
    "user",
    photo
  );


  /*
    Save user's message immediately.
  */

  saveChatMessageToHistory(
    userMessage,
    "user",
    photo
  );


  input.value =
    "";


  $("chatStatus").textContent =
    "Bolo AI is thinking…";


  $("sendBtn").disabled =
    true;


  try{

    const response =
      await fetch(
        BACKEND_URL +
        "/api/chat",
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                text ||
                "Analyse this image.",

              image:
                photo

            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Request failed"
      );

    }


    const reply =
      data.reply ||
      data.message ||
      "I could not generate a reply.";


    addMessage(
      reply,
      "assistant"
    );


    /*
      Save AI reply.
    */

    saveChatMessageToHistory(
      reply,
      "assistant",
      null
    );


    if(
      voiceReplyEnabled
    ){

      setTimeout(
        function(){

          speakText(
            reply
          );

        },
        180
      );

    }

  }catch(error){

    console.error(
      error
    );


    const errorMessage =
      "Sorry, I could not connect to Bolo AI right now. Please check your Render backend.";


    addMessage(
      errorMessage,
      "assistant"
    );


    saveChatMessageToHistory(
      errorMessage,
      "assistant",
      null
    );

  }finally{

    $("chatStatus").textContent =
      "";


    $("sendBtn").disabled =
      false;


    removePhoto();

  }

}


/* =========================================
   PHOTO UPLOAD
========================================= */

function handlePhoto(event){

  const file =
    event.target.files &&
    event.target.files[0];


  if(!file){
    return;
  }


  if(
    file.size >
    10 * 1024 * 1024
  ){

    showToast(
      "Please choose an image under 10 MB."
    );

    return;

  }


  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    showToast(
      "Please choose an image file."
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(){

      selectedPhoto =
        reader.result;


      $("previewImage").src =
        selectedPhoto;


      $("photoPreview").style.display =
        "block";


      showToast(
        "Photo ready."
      );

    };


  reader.readAsDataURL(
    file
  );

}


function removePhoto(){

  selectedPhoto =
    null;


  $("photoPreview").style.display =
    "none";


  $("previewImage").src =
    "";


  $("photoInput").value =
    "";

}


/* =========================================
   VOICE INPUT
========================================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    showToast(
      "Voice input is not supported in this browser."
    );

    return;

  }


  if(recognition){

    recognition.stop();

    recognition =
      null;

    return;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";


  recognition.interimResults =
    true;


  recognition.continuous =
    false;


  recognition.onstart =
    function(){

      $("chatStatus").textContent =
        "Listening…";


      $("micBtn").textContent =
        "⏹️";

    };


  recognition.onresult =
    function(event){

      let transcript =
        "";


      for(
        const result
        of event.results
      ){

        transcript +=
          result[0].transcript;

      }


      $("chatInput").value =
        transcript;

    };


  recognition.onerror =
    function(){

      showToast(
        "Microphone input could not be started."
      );

    };


  recognition.onend =
    function(){

      $("chatStatus").textContent =
        "";


      $("micBtn").textContent =
        "🎙️";


      recognition =
        null;

    };


  try{

    recognition.start();

  }catch(error){

    console.error(
      error
    );

  }

}


/* =========================================
   VOICE REPLY
========================================= */

let voiceReplyEnabled =
  localStorage.getItem(
    "boloVoiceReply"
  ) === "on";


let currentlySpeaking =
  false;


function updateVoiceReplyUI(){

  const button =
    $("voiceReplyBtn");


  const icon =
    $("voiceIcon");


  const title =
    $("voiceTitle");


  const status =
    $("voiceStatus");


  const control =
    $("voiceControl");


  if(!button){
    return;
  }


  if(
    voiceReplyEnabled
  ){

    button.textContent =
      "🔊 ON";


    button.classList.add(
      "active"
    );


    icon.textContent =
      "🔊";


    title.textContent =
      "Voice Reply On";


    status.textContent =
      currentlySpeaking
        ? "Bolo AI is speaking…"
        : "AI replies will speak automatically";

  }else{

    button.textContent =
      "🔇 OFF";


    button.classList.remove(
      "active"
    );


    icon.textContent =
      "🔇";


    title.textContent =
      "Voice Reply Off";


    status.textContent =
      "Tap to speak AI replies";

  }


  if(control){

    control.classList.toggle(
      "speaking",

    );

  }

}


function toggleVoiceReply(){

  voiceReplyEnabled =
    !voiceReplyEnabled;


  localStorage.setItem(
    "boloVoiceReply",
    voiceReplyEnabled
      ? "on"
      : "off"
  );


  updateVoiceReplyUI();


  if(
    voiceReplyEnabled
  ){

    showToast(
      "Voice replies are ON."
    );


    speakText(
      "Voice replies are now on."
    );

  }else{

    stopSpeaking();


    showToast(
      "Voice replies are OFF."
    );

  }

}


function getVoiceLanguage(
  text
){

  if(
    /[\u0900-\u097F]/.test(
      text
    )
  ){

    return "hi-IN";

  }


  return "en-IN";

}


function getBestVoice(
  language
){

  if(
    !window.speechSynthesis
  ){

    return null;

  }


  const voices =
    window.speechSynthesis
      .getVoices();


  if(!voices.length){
    return null;
  }


  const exact =
    voices.find(
      function(voice){

        return (
          voice.lang &&
          voice.lang.toLowerCase() ===
          language.toLowerCase()
        );

      }
    );


  if(exact){
    return exact;
  }


  const prefix =
    language
      .split("-")[0]
      .toLowerCase();


  return voices.find(
    function(voice){

      return (
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith(
            prefix
          )
      );

    }
  ) || voices[0];

}


function speakText(
  text
){

  if(
    !text ||
    !window.speechSynthesis
  ){

    showToast(
      "Speech is not supported in this browser."
    );

    return;

  }


  stopSpeaking();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  const language =
    getVoiceLanguage(
      text
    );


  utterance.lang =
    language;


  const voice =
    getBestVoice(
      language
    );


  if(voice){

    utterance.voice =
      voice;

  }


  utterance.rate =
    0.96;


  utterance.pitch =
    1;


  utterance.volume =
    1;


  utterance.onstart =
    function(){

      currentlySpeaking =
        true;


      updateVoiceReplyUI();

    };


  utterance.onend =
    function(){

      currentlySpeaking =
        false;


      updateVoiceReplyUI();

    };


  utterance.onerror =
    function(){

      currentlySpeaking =
        false;


      updateVoiceReplyUI();

    };


  window.speechSynthesis
    .speak(
      utterance
    );

}


function stopSpeaking(){

  if(
    window.speechSynthesis
  ){

    window.speechSynthesis.cancel();

  }


  currentlySpeaking =
    false;


  updateVoiceReplyUI();

}


function listenToMessage(
  text
){

  if(!text){
    return;
  }


  speakText(
    text
  );

}


if(
  window.speechSynthesis
){

  window.speechSynthesis
    .addEventListener(
      "voiceschanged",
      function(){

        updateVoiceReplyUI();

      }
    );

}


updateVoiceReplyUI();


/* =========================================
   IMAGE GENERATOR
========================================= */

async function generateImage(){

  const prompt =
    $("imagePrompt")
      .value
      .trim();


  if(!prompt){

    showToast(
      "Describe the image first."
    );

    return;

  }


  const button =
    $("generateBtn");


  button.disabled =
    true;


  button.textContent =
    "Creating…";


  $("generatedResult").innerHTML =
    '<div class="loading">Creating your image…</div>';


  try{

    const response =
      await fetch(
        BACKEND_URL +
        "/api/generate-image",
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              prompt
            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Image generation failed"
      );

    }


    const image =
      data.image ||
      data.imageUrl ||
      data.url;


    if(!image){

      throw new Error(
        "No image returned."
      );

    }


    $("generatedResult").innerHTML =
      "";


    const imageElement =
      document.createElement(
        "img"
      );


    imageElement.src =
      image;


    imageElement.alt =
      "Generated by Bolo AI";


    $("generatedResult")
      .appendChild(
        imageElement
      );


    addMessage(
      "I created this image from your prompt: " +
      prompt,
      "assistant",
      image
    );


    saveChatMessageToHistory(
      "I created this image from your prompt: " +
      prompt,
      "assistant",
      null
    );


    showToast(
      "Image created successfully."
    );


  }catch(error){

    console.error(
      error
    );


    $("generatedResult").innerHTML =
      '<div class="loading">Image generation is unavailable right now. Please check the Render /api/generate-image endpoint.</div>';

  }finally{

    button.disabled =
      false;


    button.textContent =
      "Create";

  }

}
